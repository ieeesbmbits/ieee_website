<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive 3D Photo Gallery | IEEE Student Branch MBITS</title>
  <meta name="description"
    content="Explore our interactive 3D Dome Photo Gallery showcasing events, workshops, and achievements of IEEE Student Branch MBITS." />

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700;800&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #090909;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
    }

    /* Scroll Lock helper for Dome Gallery */
    body.dg-scroll-lock {
      overflow: hidden !important;
    }

    .gallery-page-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at 50% 30%, #171512 0%, #090909 80%);
    }

    /* Header Overlay */
    .gallery-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      padding: 1.25rem 2rem;
      background: linear-gradient(to bottom, rgba(9, 9, 9, 0.92) 0%, rgba(9, 9, 9, 0.4) 70%, transparent 100%);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      pointer-events: auto;
    }

    .gallery-header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .gallery-back-btn, .gallery-nav-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.2rem;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      color: #e9d494;
      background: rgba(233, 212, 148, 0.08);
      border: 1px solid rgba(233, 212, 148, 0.25);
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .gallery-back-btn:hover, .gallery-nav-link:hover {
      background: #e9d494;
      color: #090909;
      box-shadow: 0 0 15px rgba(233, 212, 148, 0.4);
      transform: translateY(-1px);
    }

    .gallery-title-wrap {
      text-align: center;
    }

    .gallery-title {
      font-family: 'Anton', sans-serif;
      font-size: 1.75rem;
      letter-spacing: 1.5px;
      background: linear-gradient(135deg, #ffffff 30%, #e9d494 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .gallery-subtitle {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 0.2rem;
      font-weight: 400;
    }

    .gallery-controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .gallery-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.1rem;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.85rem;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .gallery-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .gallery-toggle-btn.active {
      background: rgba(233, 212, 148, 0.2);
      border-color: #e9d494;
      color: #e9d494;
    }

    /* 3D Dome Viewport */
    .gallery-viewport {
      width: 100vw;
      height: 100vh;
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    @media (max-width: 768px) {
      .gallery-header {
        padding: 0.6rem 0.75rem;
      }

      .gallery-header-inner {
        flex-wrap: nowrap;
        justify-content: space-between;
        gap: 0.4rem;
      }

      .gallery-title {
        font-size: 0.95rem;
        letter-spacing: 0.5px;
        white-space: nowrap;
      }

      .gallery-subtitle {
        display: none;
      }

      .gallery-back-btn, .gallery-nav-link, .gallery-toggle-btn {
        padding: 0.4rem 0.65rem;
        font-size: 0.75rem;
        white-space: nowrap;
      }

      .gallery-controls {
        gap: 0.4rem;
      }
    }
  </style>
  <script type="module" crossorigin src="./assets/gallery-COk1RSW6.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/main-DqiVASqb.js">
  <link rel="stylesheet" crossorigin href="./assets/main-CfWsbzfo.css">
  <link rel="stylesheet" crossorigin href="./assets/gallery-lq2vMvv8.css">
</head>

<body>
  <div id="gallery-root"></div>
</body>

</html>
