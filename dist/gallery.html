<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive 3D Photo Gallery | IEEE Student Branch MBITS</title>
  <meta name="description"
    content="Explore our interactive 3D Dome Photo Gallery showcasing events, workshops, and achievements of IEEE Student Branch MBITS." />

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700;800&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #090909;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    .gallery-page-container {
      position: relative;
      width: 100vw;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at 50% 30%, #171512 0%, #090909 80%);
    }

    .gallery-page-container.globe-mode {
      min-height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .gallery-page-container.globe-mode .gallery-viewport {
      position: relative;
      top: 0;
      height: 100vh;
      min-height: 650px;
    }

    .gallery-page-container.normal-mode {
      height: auto;
      min-height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
    }

    /* Floating View Mode Switcher Bar */
    .gallery-control-bar {
      position: fixed;
      top: 90px;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      justify-content: center;
      padding: 0.5rem;
      pointer-events: none;
    }

    .gallery-control-inner {
      pointer-events: auto;
      background: rgba(18, 19, 22, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(233, 212, 148, 0.35);
      border-radius: 9999px;
      padding: 5px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }

    .gallery-view-mode-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .view-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: 9999px;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.88rem;
      color: #b0b0b0;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .view-toggle-btn:hover {
      color: #ffffff;
    }

    .view-toggle-btn.active {
      background: #e9d494;
      color: #090909;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(233, 212, 148, 0.4);
    }

    /* 3D Globe Viewport */
    .gallery-viewport {
      width: 100vw;
      height: calc(100vh - 90px);
      position: absolute;
      top: 90px;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1;
    }

    /* Normal View Container & Grid */
    .normal-gallery-container {
      width: 100%;
      min-height: 100vh;
      padding-top: 155px;
      padding-bottom: 70px;
      padding-left: 2rem;
      padding-right: 2rem;
      max-width: 1440px;
      margin: 0 auto;
      box-sizing: border-box;
    }

    .normal-gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 1.5rem;
    }

    .normal-gallery-card {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: #141414;
      border: 1px solid rgba(255, 255, 255, 0.12);
      aspect-ratio: 4 / 3;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .normal-gallery-card:hover {
      transform: translateY(-5px) scale(1.02);
      border-color: rgba(233, 212, 148, 0.6);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 20px rgba(233, 212, 148, 0.2);
    }

    .normal-gallery-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .normal-gallery-card:hover .normal-gallery-img {
      transform: scale(1.07);
    }

    .normal-gallery-overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 9, 9, 0.65);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      opacity: 0;
      transition: opacity 0.3s ease;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .normal-gallery-card:hover .normal-gallery-overlay {
      opacity: 1;
    }

    .normal-gallery-overlay i {
      font-size: 1.4rem;
      color: #e9d494;
    }

    /* Normal View Lightbox Modal */
    .normal-lightbox-modal {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(0, 0, 0, 0.93);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .normal-lightbox-content {
      position: relative;
      max-width: 90vw;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .normal-lightbox-img {
      max-width: 90vw;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 16px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95);
      border: 1px solid rgba(233, 212, 148, 0.3);
    }

    .normal-lightbox-caption {
      margin-top: 1rem;
      color: #e9d494;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      text-align: center;
    }

    .normal-lightbox-close {
      position: absolute;
      top: -45px;
      right: 0;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transition: all 0.2s ease;
    }

    .normal-lightbox-close:hover {
      background: rgba(255, 80, 64, 0.5);
      color: #ffffff;
      transform: scale(1.1);
    }

    @media (max-width: 768px) {
      .gallery-control-bar {
        top: 75px;
      }

      .view-toggle-btn {
        padding: 6px 14px;
        font-size: 0.78rem;
        gap: 6px;
      }

      .normal-gallery-container {
        padding-top: 135px;
        padding-left: 1rem;
        padding-right: 1rem;
      }

      .normal-gallery-grid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 0.85rem;
      }
    }
  </style>

</head>

</body>

</html>
