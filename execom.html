<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Execom Members | IEEE Student Branch MBITS</title>
  <meta name="description" content="Meet the Execom members & Chapter Leadership of IEEE Student Branch MBITS." />

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700;800&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Custom Execom Styles -->
  <link rel="stylesheet" href="./src/style.css" />
  <link rel="stylesheet" href="./execom.css" />
</head>

<body>

  <!-- Navigation Bar (Fixed & Transparent) -->
  <header class="navbar" id="navbar">
    <div class="nav-container">
      <!-- Brand Logo: logo.png -->
      <a href="./index.html" class="brand-logo" aria-label="IEEE MBITS Home">
        <img src="./logo.png" alt="IEEE MBITS Logo" class="brand-logo-img" />
      </a>

      <!-- Left-aligned Nav Links next to Logo -->
      <nav class="nav-menu" id="navMenu">
        <a href="./index.html#hero" class="nav-link">Home</a>
        <a href="./execom.html" class="nav-link active">Execom</a>
        <a href="./gallery.html" class="nav-link">Gallery</a>
        <a href="./event.html" class="nav-link">Events</a>
        <a href="./index.html#support-request" class="btn btn-donate mobile-nav-join">Join Now</a>
      </nav>

      <!-- Right Action Buttons -->
      <div class="nav-actions">
        <a href="./index.html#support-request" class="btn btn-donate desktop-join">Join Now</a>
        <button class="nav-hamburger" id="navToggle" aria-label="Toggle navigation menu" aria-expanded="false">
          <span class="hamburger-bar"></span>
          <span class="hamburger-bar"></span>
          <span class="hamburger-bar"></span>
        </button>
      </div>
    </div>
  </header>

  <!-- BACKGROUND ARC GRAPHIC (from index.html) -->
  <div class="hero-eclipse" id="hero-eclipse" aria-hidden="true">
    <svg viewBox="0 0 598 1219" fill="none" xmlns="http://www.w3.org/2000/svg" class="eclipse-svg" id="eclipse-svg">
      <ellipse id="ellipse-gold" cx="760.5" cy="609.5" rx="760.5" ry="609.5" fill="#E9D494" />
      <ellipse id="ellipse-inner" cx="676" cy="491" rx="510" ry="430" fill="#090909" />
    </svg>
  </div>

  <!-- CHAPTER TABS NAVIGATION -->
  <nav class="chapter-tabs-wrapper" aria-label="Chapter Filter">
    <div class="container-large">
      <div class="chapter-tabs" id="chapterTabs"></div>
    </div>
  </nav>

  <!-- MEMBER GRID SECTION -->
  <main class="execom-grid-section" id="execom">
    <div class="container-large">
      <div class="execom-grid" id="memberGrid"></div>
    </div>
  </main>

  <!-- MEMBER DETAIL MODAL OVERLAY WITH REACT BITS PROFILE CARD -->
  <div class="member-overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalName">
    <button class="member-close" id="closeBtn" aria-label="Close Profile">
      <i class="fa-solid fa-xmark"></i>
    </button>
    
    <!-- React Bits Profile Card Component -->
    <div class="pc-card-wrapper" id="pcCardWrapper">
      <div class="pc-behind"></div>
      <div class="pc-card-shell" id="pcCardShell">
        <section class="pc-card">
          <div class="pc-inside">
            <div class="pc-shine"></div>
            <div class="pc-glare"></div>
            
            <!-- Avatar Layer -->
            <div class="pc-content pc-avatar-content">
              <img className="avatar" class="avatar" id="modalAvatar" src="./logo.png" alt="Member Avatar" />
              
              <!-- User Info Bottom Bar -->
              <div class="pc-user-info">
                <div class="pc-user-details">
                  <div class="pc-mini-avatar">
                    <img id="modalMiniAvatar" src="./logo.png" alt="Mini Avatar" />
                  </div>
                  <div class="pc-user-text">
                    <div class="pc-handle" id="modalHandle">@member</div>
                    <div class="pc-status" id="modalStatus">IEEE MBITS</div>
                  </div>
                </div>

                <div class="pc-actions">
                  <a class="pc-contact-btn" id="linkLinkedin" href="#" target="_blank" rel="noopener" aria-label="LinkedIn">
                    <i class="fa-brands fa-linkedin-in"></i> LinkedIn
                  </a>
                  <a class="pc-contact-btn" id="linkInsta" href="#" target="_blank" rel="noopener" aria-label="Instagram">
                    <i class="fa-brands fa-instagram"></i> Instagram
                  </a>
                </div>
              </div>
            </div>

            <!-- Name & Role Title Layer -->
            <div class="pc-content">
              <div class="pc-details">
                <h3 id="modalName">Member Name</h3>
                <p id="modalTitle">Role Title</p>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
  <script type="module" src="./execom.js"></script>
</body>

</html>
